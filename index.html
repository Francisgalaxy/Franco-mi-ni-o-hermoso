<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librito para Franco 💖</title>
    <style>
        /* Estilos generales */
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Contenedor principal del libro */
        .book-container {
            perspective: 2000px;
            position: relative;
            width: 400px;
            height: 600px;
        }

        /* El libro en sí */
        .book {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        /* Cada página individual */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 5px;
            box-shadow: inset 3px 0 10px rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.3);
            transform-origin: left center;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        /* Estilo de las imágenes dentro del libro */
        .page img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.5s ease;
        }

        /* Clases para corregir la orientación de las imágenes */
        .rot-180 { transform: rotate(180deg); }
        .rot-90 { transform: rotate(90deg) scale(0.65); }
        .rot-270 { transform: rotate(-90deg) scale(0.65); }
        .rot-0 { transform: rotate(0deg); }

        /* Botones de control */
        .controls {
            position: absolute;
            bottom: -70px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 1000;
        }

        button {
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 25px;
            background-color: #ecf0f1;
            color: #2c3e50;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }

        button:hover {
            background-color: #bdc3c7;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Sombra decorativa debajo del libro */
        .table-shadow {
            position: absolute;
            bottom: -20px;
            left: 5%;
            width: 90%;
            height: 20px;
            background: rgba(0,0,0,0.5);
            filter: blur(10px);
            border-radius: 50%;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="book-container">
        <div class="book" id="book">
            <!-- Página 1 -->
            <div class="page">
                <img src="IMG20260929_233703.jpg" alt="Página 1" class="rot-0">
            </div>
            <!-- Página 2 -->
            <div class="page">
                <img src="IMG_20260929_233719.jpg" alt="Página 2" class="rot-0">
            </div>
            <!-- Página 3 -->
            <div class="page">
                <img src="IMG20260929_233737.jpg" alt="Página 3" class="rot-180">
            </div>
            <!-- Página 4 -->
            <div class="page">
                <img src="IMG_20260929_233748.jpg" alt="Página 4" class="rot-180">
            </div>
            <!-- Página 5 -->
            <div class="page">
                <img src="IMG-IMG_20260929_233804.jpg" alt="Página 5" class="rot-180">
            </div>
            <!-- Página 6 -->
            <div class="page">
                <img src="IMG-20260929_233837.jpg" alt="Página 6" class="rot-90">
            </div>
            <!-- Página 7 -->
            <div class="page">
                <img src="IMG_20260929_233901.jpg" alt="Página 7" class="rot-90">
            </div>
            <!-- Página 8 -->
            <div class="page">
                <img src="IMG-20260929_233911.jpg" alt="Página 8" class="rot-90">
            </div>
            <!-- Página 9 -->
            <div class="page">
                <img src="IMG-20260929_233933.jpg" alt="Página 9" class="rot-270">
            </div>
            <!-- Página 10 -->
            <div class="page">
                <img src="IMG_20260929_234000.jpg" alt="Página 10" class="rot-180">
            </div>
        </div>
        
        <div class="table-shadow"></div>

        <div class="controls">
            <button onclick="prevPage()">Anterior</button>
            <button onclick="nextPage()">Siguiente</button>
        </div>
    </div>

    <script>
        let currentPage = 0;
        const pages = document.querySelectorAll('.page');
        const totalPages = pages.length;

        function updateBook() {
            pages.forEach((page, index) => {
                if (index < currentPage) {
                    // Páginas volteadas
                    page.style.transform = 'rotateY(-180deg)';
                    page.style.zIndex = index + 1;
                } else {
                    // Páginas pendientes por leer
                    page.style.transform = 'rotateY(0deg)';
                    page.style.zIndex = totalPages - index;
                }
            });
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                updateBook();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                updateBook();
            }
        }

        // Inicialización
        updateBook();
    </script>
</body>
</html>
